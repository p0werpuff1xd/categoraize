<path d="M172 515 L476 736 L176 906 Q164 889 164 858 L164 527 Q164 520 172 515Z" fill="url(#paper)" stroke="#1e1b4b" stroke-width="22" stroke-linejoin="round"/>
<path d="M839 515 L538 736 L834 907 Q847 889 847 857 L847 527 Q847 520 839 515Z" fill="url(#paper)" stroke="#1e1b4b" stroke-width="22" stroke-linejoin="round"/>
