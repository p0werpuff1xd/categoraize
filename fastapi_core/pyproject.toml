[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "categoraiize-intelligence"
version = "0.1.0"
description = "Bilingual deterministic intelligence service for CategorAIze"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ml = [
  "dateparser>=1.2,<2.0",
  "langdetect>=1.0,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "spacy>=3.7,<4.0",
]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
