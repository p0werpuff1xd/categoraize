[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "categoraize-nlp"
version = "0.2.0"
description = "CategorAIze NLP service: Sentence-BERT classification, span tagging, priority rules and Rocchio feedback"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1.0",
  "sentence-transformers>=3.0,<6.0",
  "langdetect>=1.0,<2.0",
  "dateparser>=1.2,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
