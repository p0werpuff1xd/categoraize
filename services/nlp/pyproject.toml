[project]
name = "categoraiize-nlp"
version = "0.1.0"
description = "Local FastAPI inference service for CategorAIze email algorithms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.0,<6",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
