<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">CategorAIze UML Use Case Diagram</title>
  <desc id="desc">Use case diagram showing user, Gmail, Google Calendar, messaging platforms, and FastAPI intelligence service interacting with CategorAIze.</desc>
  <defs>
    <style>
      .boundary { fill:#f8fafc; stroke:#172033; stroke-width:3; }
      .usecase { fill:#fff; stroke:#2457a6; stroke-width:2; }
      .actor-line { stroke:#172033; stroke-width:2.5; fill:none; }
      .include { stroke:#64748b; stroke-width:2; stroke-dasharray:8 6; fill:none; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#172033; font-size:20px; }
      .small { font-family:Arial,Helvetica,sans-serif; fill:#172033; font-size:16px; }
      .title { font-family:Arial,Helvetica,sans-serif; fill:#172033; font-size:28px; font-weight:bold; }
      .system { font-family:Arial,Helvetica,sans-serif; fill:#172033; font-size:25px; font-weight:bold; }
      .stereotype { font-family:Arial,Helvetica,sans-serif; fill:#475569; font-size:15px; font-style:italic; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>

  <text x="750" y="42" text-anchor="middle" class="title">CategorAIze — UML Use Case Diagram</text>

  <!-- system boundary -->
  <rect x="300" y="80" width="930" height="850" rx="4" class="boundary"/>
  <text x="765" y="117" text-anchor="middle" class="system">CategorAIze Email Intelligence System</text>

  <!-- actors -->
  <g class="label" text-anchor="middle">
    <circle cx="120" cy="190" r="22" class="actor-line"/><path d="M120 212 L120 285 M80 235 L160 235 M120 285 L82 340 M120 285 L158 340" class="actor-line"/><text x="120" y="375">Email User</text>
    <circle cx="1360" cy="190" r="22" class="actor-line"/><path d="M1360 212 L1360 285 M1320 235 L1400 235 M1360 285 L1322 340 M1360 285 L1398 340" class="actor-line"/><text x="1360" y="375">Gmail</text>
    <circle cx="120" cy="635" r="22" class="actor-line"/><path d="M120 657 L120 730 M80 680 L160 680 M120 730 L82 785 M120 730 L158 785" class="actor-line"/><text x="120" y="820">Google Calendar</text>
    <circle cx="1360" cy="635" r="22" class="actor-line"/><path d="M1360 657 L1360 730 M1320 680 L1400 680 M1360 730 L1322 785 M1360 730 L1398 785" class="actor-line"/><text x="1360" y="820">FastAPI Intelligence</text><text x="1360" y="842" class="small">Service</text>
  </g>

  <!-- use cases -->
  <g class="label" text-anchor="middle">
    <ellipse cx="520" cy="205" rx="155" ry="42" class="usecase"/><text x="520" y="199">Connect and authorize</text><text x="520" y="224">Gmail account</text>
    <ellipse cx="850" cy="205" rx="160" ry="42" class="usecase"/><text x="850" y="199">Ingest and sanitize</text><text x="850" y="224">email messages</text>
    <ellipse cx="1080" cy="350" rx="145" ry="42" class="usecase"/><text x="1080" y="344">Classify email</text><text x="1080" y="369">and assign category</text>
    <ellipse cx="730" cy="350" rx="145" ry="42" class="usecase"/><text x="730" y="344">Extract deadlines</text><text x="730" y="369">and action items</text>
    <ellipse cx="520" cy="500" rx="150" ry="42" class="usecase"/><text x="520" y="494">Score priority</text><text x="520" y="519">and urgency</text>
    <ellipse cx="850" cy="500" rx="155" ry="42" class="usecase"/><text x="850" y="494">Search and triage</text><text x="850" y="519">smart inbox</text>
    <ellipse cx="1080" cy="650" rx="150" ry="42" class="usecase"/><text x="1080" y="644">Review and correct</text><text x="1080" y="669">classifications</text>
    <ellipse cx="730" cy="650" rx="155" ry="42" class="usecase"/><text x="730" y="644">Confirm deadline</text><text x="730" y="669">or task reminder</text>
    <ellipse cx="520" cy="800" rx="145" ry="42" class="usecase"/><text x="520" y="794">Draft contextual</text><text x="520" y="819">email reply</text>
    <ellipse cx="850" cy="800" rx="155" ry="42" class="usecase"/><text x="850" y="794">Apply labels, archive,</text><text x="850" y="819">or unsubscribe</text>
  </g>

  <!-- actor associations -->
  <path d="M142 235 L365 205" class="actor-line"/><path d="M142 260 L375 485" class="actor-line"/><path d="M142 280 L380 780" class="actor-line"/>
  <path d="M1338 235 L1010 205" class="actor-line"/><path d="M1338 260 L1225 345" class="actor-line"/><path d="M1338 285 L1000 790" class="actor-line"/>
  <path d="M142 680 L575 650" class="actor-line"/><path d="M142 700 L575 800" class="actor-line"/>
  <path d="M1338 680 L1235 650" class="actor-line"/><path d="M1338 700 L1220 350" class="actor-line"/><path d="M1338 720 L1000 500" class="actor-line"/>

  <!-- include relationships -->
  <path d="M835 244 L760 305" class="include" marker-end="url(#arrow)"/><text x="790" y="277" class="stereotype">&lt;&lt;include&gt;&gt;</text>
  <path d="M940 220 L1040 315" class="include" marker-end="url(#arrow)"/><text x="1000" y="264" class="stereotype">&lt;&lt;include&gt;&gt;</text>
  <path d="M650 500 L680 385" class="include" marker-end="url(#arrow)"/><text x="625" y="445" class="stereotype">&lt;&lt;include&gt;&gt;</text>
  <path d="M1010 650 L900 525" class="include" marker-end="url(#arrow)"/><text x="950" y="600" class="stereotype">&lt;&lt;include&gt;&gt;</text>

  <!-- legend -->
  <line x1="360" y1="895" x2="460" y2="895" class="include" marker-end="url(#arrow)"/><text x="470" y="901" class="small">&lt;&lt;include&gt;&gt; — required supporting behavior</text>
</svg>
